name: Claude attribution policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: claude-attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect-attribution:
    name: Claude attribution policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted policy from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Inspect pull-request and commit attribution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_pr_attribution.py
